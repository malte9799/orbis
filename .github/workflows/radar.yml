name: Update radar composites

# Turns raw radar rasters (DWD RV, …) into smooth, value-encoded PNG composites per region and
# time step (scripts/radar-composite.mjs) and publishes them on the `radar` branch, served to the
# app via raw.githubusercontent.com (src/globe/hdradar.ts). GitHub's cron is best effort: runs
# every 5 min are often delayed, so the radar can lag by a few minutes.

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/radar-composite.mjs', '.github/workflows/radar.yml']

permissions:
  contents: write

concurrency:
  group: radar-composites
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Previous composites
        run: |
          if git fetch --depth=1 origin radar; then
            git worktree add --detach ../radar-prev FETCH_HEAD
          else
            mkdir -p ../radar-prev
          fi
      - name: Build composites
        run: node scripts/radar-composite.mjs ../radar-out ../radar-prev
      - name: Publish radar branch
        working-directory: ../radar-out
        run: |
          test -f manifest.json
          git init -q -b radar
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "Radar composites $(date -u +%Y-%m-%dT%H:%MZ)"
          # a single orphan commit keeps the branch small
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" radar
