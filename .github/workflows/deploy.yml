name: Deploy (main + branch previews)

# main → https://<owner>.github.io/<repo>/
# every other branch → https://<owner>.github.io/<repo>/preview/<branch>/
# Published on the `gh-pages` branch (Settings → Pages → Source: Deploy from a branch → gh-pages / root).

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    # `data` only holds snapshots, no app
    if: github.event_name != 'pull_request' && github.ref_name != 'data'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Names
        id: n
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          slug=$(echo "$BRANCH" | sed 's#[^A-Za-z0-9._-]#-#g')
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          if [ "$BRANCH" = "main" ]; then echo "dir=." >> "$GITHUB_OUTPUT"; else echo "dir=preview/$slug" >> "$GITHUB_OUTPUT"; fi
          if [ "$BRANCH" != "main" ]; then
            echo "URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview/$slug/" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
      - name: 'Status: Abhängigkeiten installieren'
        if: steps.n.outputs.dir != '.'
        run: bash scripts/pr-status.sh "Abhängigkeiten installieren"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 'Status: Texturen & Modelle'
        if: steps.n.outputs.dir != '.'
        run: bash scripts/pr-status.sh "Texturen & Modelle"
      # Sharper Moon textures (NASA CGI Moon Kit, ~150 MB download), cached between deploys.
      # Optional: if NASA is unreachable the app keeps its bundled 2k map.
      - name: Cache Moon textures
        id: moon-cache
        uses: actions/cache@v4
        with:
          path: public/textures/moon
          key: moon-textures-${{ hashFiles('scripts/moon-textures.py') }}
      - uses: actions/setup-python@v5
        if: steps.moon-cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'
      - name: Moon textures
        if: steps.moon-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          pip install --quiet numpy pillow
          python scripts/moon-textures.py public/textures/moon
      # Detailed ISS model (NASA 3D Resources, ~96 MB, hosted as release asset "models"). Optional: without it the app
      # keeps the small bundled ISS model.
      - name: Cache detailed ISS model
        id: iss-cache
        uses: actions/cache@v4
        with:
          path: public/models/iss-detail.glb
          key: iss-detail-${{ hashFiles('scripts/iss-model.sh') }}
      - name: Detailed ISS model
        if: steps.iss-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: bash scripts/iss-model.sh public/models/iss-detail.glb
      # Detailed Moon map products (LROC NAC site mosaics, Kaguya, geology … from NASA Moon Trek): the list is read from
      # Trek itself. Optional: on failure the committed src/space/moon-products.ts stays.
      - name: Moon Trek products
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/moon-products.mjs
      - name: 'Status: Build'
        if: steps.n.outputs.dir != '.'
        run: bash scripts/pr-status.sh "Build"
      - run: npm run build
        env:
          # shared data proxy (proxy/cloudflare-worker.js) – Settings → Secrets and variables → Actions → Variables
          VITE_PROXY_URL: ${{ vars.PROXY_URL }}
      - name: 'Status: Veröffentlichen'
        if: steps.n.outputs.dir != '.'
        run: bash scripts/pr-status.sh "Veröffentlichen"
      - name: Publish to gh-pages
        env:
          DIR: ${{ steps.n.outputs.dir }}
        run: |
          set -e
          repo="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$repo" gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "$repo" ../pages
          else
            mkdir ../pages && git -C ../pages init -q -b gh-pages
          fi
          cd ../pages
          if [ "$DIR" = "." ]; then
            # main: replace everything except the previews
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name preview -exec rm -rf {} +
          else
            rm -rf "$DIR"; mkdir -p "$DIR"
          fi
          cp -a "$GITHUB_WORKSPACE/dist/." "$DIR/"
          # marker so the online check can tell this deploy from a previous one
          echo "$GITHUB_SHA" > "$DIR/deploy.txt"
          touch .nojekyll
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q --amend --no-edit 2>/dev/null \
            || git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "Deploy ${{ github.sha }}"
          git push -f "$repo" gh-pages
      - name: 'Status: Online prüfen'
        if: steps.n.outputs.dir != '.'
        run: bash scripts/pr-status.sh "Online prüfen"
      - name: Wait until the page is live
        if: steps.n.outputs.dir != '.'
        run: |
          # GitHub Pages serves 404 (or the previous deploy) until its build finishes
          for i in $(seq 1 40); do
            got=$(curl -fsS --max-time 10 "${URL}deploy.txt?t=$(date +%s)" 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$got" = "$GITHUB_SHA" ]; then echo "live after attempt $i"; exit 0; fi
            echo "attempt $i: not live yet (${got:-404/unreachable})"
            sleep 10
          done
          echo "::error::$URL did not serve this commit within ~7 min"
          exit 1
      - name: 'Status: fertig'
        if: success() && steps.n.outputs.dir != '.'
        run: bash scripts/pr-status.sh "" done
      - name: 'Status: fehlgeschlagen'
        if: failure() && steps.n.outputs.dir != '.'
        run: bash scripts/pr-status.sh "" failed
      - name: 'Status: abgebrochen'
        if: cancelled() && steps.n.outputs.dir != '.'
        run: bash scripts/pr-status.sh "" cancelled

  announce:
    # PR opened after its branch's build already finished → that build found no PR, so post the status here.
    # No build: only checks that the preview serves the PR's head commit. Still building → the build comments itself.
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Status comment if the preview is already live
        run: |
          slug=$(echo "$BRANCH" | sed 's#[^A-Za-z0-9._-]#-#g')
          export URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview/$slug/"
          got=$(curl -fsS --max-time 10 "${URL}deploy.txt?t=$(date +%s)" 2>/dev/null | tr -d '[:space:]' || true)
          if [ "$got" = "$SHA" ]; then bash scripts/pr-status.sh "" done
          else echo "preview not (yet) at $SHA (${got:-404}) – the running build will comment"; fi

  cleanup:
    # PR closed (merged or not) → remove its preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Remove preview
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -e
          dir="preview/$(echo "$BRANCH" | sed 's#[^A-Za-z0-9._-]#-#g')"
          repo="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone --depth 1 --branch gh-pages "$repo" ../pages || exit 0
          cd ../pages
          [ -d "$dir" ] || exit 0
          rm -rf "$dir"
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q --amend --no-edit
          git push -f "$repo" gh-pages
