name: Deploy (main + branch previews)

# main → https://<owner>.github.io/<repo>/
# every other branch → https://<owner>.github.io/<repo>/preview/<branch>/
# Published on the `gh-pages` branch (Settings → Pages → Source: Deploy from a branch → gh-pages / root).
# Related: pr-preview.yml (status comment on new PRs), preview-cleanup.yml (removes old previews).

on:
  push:
    # `data` and `data-osm` only hold snapshots, `gh-pages` is the output
    branches-ignore: [data, data-osm, gh-pages]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# a newer push to the same branch supersedes a running preview build; main deploys always finish
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Names
        id: n
        run: |
          slug=$(bash scripts/gh-pages.sh slug "$BRANCH")
          if [ "$BRANCH" = "main" ]; then echo "dir=." >> "$GITHUB_OUTPUT"; else echo "dir=preview/$slug" >> "$GITHUB_OUTPUT"; fi
          if [ "$BRANCH" != "main" ]; then
            echo "URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview/$slug/" >> "$GITHUB_ENV"
          fi
      - name: 'Status: Abhängigkeiten installieren'
        if: steps.n.outputs.dir != '.'
        run: bash scripts/pr-status.sh "Abhängigkeiten installieren"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Heavy optional assets (Moon textures, detailed ISS model, Trek product lists) only on main: previews would
      # each publish ~250 MB extra to gh-pages and the app falls back to the bundled assets / committed lists anyway.
      # Sharper Moon textures (NASA CGI Moon Kit, ~150 MB download), cached between deploys.
      # Optional: if NASA is unreachable the app keeps its bundled 2k map.
      - name: Cache Moon textures
        if: github.ref == 'refs/heads/main'
        id: moon-cache
        uses: actions/cache@v6
        with:
          path: public/textures/moon
          key: moon-textures-${{ hashFiles('scripts/moon-textures.py') }}
      - uses: actions/setup-python@v7
        if: github.ref == 'refs/heads/main' && steps.moon-cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'
      - name: Moon textures
        if: github.ref == 'refs/heads/main' && steps.moon-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          pip install --quiet numpy pillow
          python scripts/moon-textures.py public/textures/moon
      # Detailed ISS model (NASA 3D Resources, ~96 MB, hosted as release asset "models"). Optional: without it the app
      # keeps the small bundled ISS model.
      - name: Cache detailed ISS model
        if: github.ref == 'refs/heads/main'
        id: iss-cache
        uses: actions/cache@v6
        with:
          path: public/models/iss-detail.glb
          key: iss-detail-${{ hashFiles('scripts/iss-model.sh') }}
      - name: Detailed ISS model
        if: github.ref == 'refs/heads/main' && steps.iss-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: bash scripts/iss-model.sh public/models/iss-detail.glb
      # Detailed Moon map products (LROC NAC site mosaics, Kaguya, geology … from NASA Moon Trek): the list is read from
      # Trek itself. Optional: on failure the committed src/space/moon-products.ts stays.
      - name: Moon Trek products
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/moon-products.mjs
      # Tile products of the Trek portals without their own script (Venus, Io, Europa, Callisto, Phobos, Titan …):
      # Optional: on failure the committed src/space/trek-products.ts stays.
      - name: Trek portal products
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/trek-products.mjs
      - name: 'Status: Build'
        if: steps.n.outputs.dir != '.'
        run: bash scripts/pr-status.sh "Build"
      - run: pnpm build
        env:
          # shared data proxy (Orbismap/data: workers/proxy) – Settings → Secrets and variables → Actions → Variables
          VITE_PROXY_URL: ${{ vars.PROXY_URL }}
          # worker with corrected camera viewing directions (Orbismap/data: workers/camdir) – same place, Variables
          VITE_CAMDIR_URL: ${{ vars.CAMDIR_URL }}
          # worker for Fahrplan push notifications (Orbismap/data: workers/push) – same place, Variables
          VITE_PUSH_URL: ${{ vars.PUSH_URL }}
          # optional Mapillary client token for the street game (public by nature, it ends up in the bundle) – same place, Variables
          VITE_MAPILLARY_TOKEN: ${{ vars.MAPILLARY_TOKEN }}
          # optional own hosts (empty = built-in defaults, see README "Eigene Hosts"): snapshot bases, OSM tiles, weather fields, big assets
          VITE_DATA_BASE: ${{ vars.DATA_BASE }}
          VITE_LIVE_BASE: ${{ vars.LIVE_BASE }}
          VITE_OSM_BASE: ${{ vars.OSM_BASE }}
          VITE_WETTER_BASE: ${{ vars.WETTER_BASE }}
          VITE_ASSETS_BASE: ${{ vars.ASSETS_BASE }}
      # Big static assets (models/, textures/ incl. the Moon textures and iss-detail.glb from above, data/airports|incidents|games)
      # live in an R2 bucket instead of gh-pages (1 GB limit). Only active with the repository variable ASSETS_BUCKET:
      # every branch (previews included) ships a dist/ without them.
      # Content-hashed keys (models/iss.<hash>.glb, from src/generated/assets-manifest.json which `pnpm build` wrote above):
      # uploaded on every branch, but only keys missing in the bucket, with an immutable one-year cache. A preview whose
      # asset differs from main thus gets its own key and never overwrites what main serves.
      # Plain keys (models/iss.glb, one-day cache) are synced on main only, for a transition period: older builds and
      # previews still reference them. Drop the sync once no live build uses plain paths.
      - name: Upload assets to R2
        if: vars.ASSETS_BUCKET != ''
        env:
          R2_BUCKET: ${{ vars.ASSETS_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          # R2 does not understand the new checksum headers of the AWS CLI
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::warning::R2 nicht konfiguriert – Assets-Upload übersprungen"; exit 0
          fi
          EP="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          MANIFEST=src/generated/assets-manifest.json
          if [ -f "$MANIFEST" ] && [ "$(jq 'length' "$MANIFEST")" -gt 0 ]; then
            # keys already in the bucket (hashed ones never change, so existing = up to date)
            aws s3api list-objects-v2 --bucket "$R2_BUCKET" --endpoint-url "$EP" \
              --query 'Contents[].Key' --output text | tr '\t' '\n' > existing-keys.txt
            new=0; skipped=0
            while IFS=$'\t' read -r logical hashed; do
              if grep -Fxq -- "$hashed" existing-keys.txt; then skipped=$((skipped + 1)); continue; fi
              aws s3 cp "public/$logical" "s3://$R2_BUCKET/$hashed" --endpoint-url "$EP" \
                --cache-control "public, max-age=31536000, immutable" --only-show-errors
              new=$((new + 1))
            done < <(jq -r 'to_entries[] | [.key, .value] | @tsv' "$MANIFEST")
            echo "Hashed assets: $new uploaded, $skipped already present" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::kein Assets-Manifest (VITE_ASSETS_BASE leer?) – gehashte Schlüssel übersprungen"
          fi
          if [ "$BRANCH" = "main" ]; then
            for d in models textures data/airports data/incidents data/games; do
              aws s3 sync "public/$d" "s3://$R2_BUCKET/$d" --endpoint-url "$EP" \
                --cache-control "public, max-age=86400" --only-show-errors
            done
          fi
      - name: Remove assets from dist
        if: vars.ASSETS_BUCKET != '' && vars.ASSETS_BASE != ''
        run: rm -rf dist/models dist/textures dist/data/airports dist/data/incidents dist/data/games
      # Preview-Tab-Titel „Orbis – #prN <PR-Titel>“: PR via Branch nachschlagen und in dist/index.html einbetten
      # (Index-Preview behält den Standardtitel). Ohne PR zum Branch → Branch-Name als Fallback.
      - name: 'Preview-Titel: #pr + Titel'
        if: steps.n.outputs.dir != '.'
        run: |
          if meta=$(gh pr view "$BRANCH" --repo "$REPO" --json number,title 2>/dev/null); then
            label="Orbis - #$(jq -r .number <<<"$meta") $(jq -r .title <<<"$meta")"
          else
            label="Orbis - $BRANCH"
          fi
          PREVIEW_TITLE="$label" node -e '
            const { readFileSync, writeFileSync } = require("fs");
            const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            const f = "dist/index.html";
            writeFileSync(f, readFileSync(f, "utf8").replace(/<title>[\s\S]*?<\/title>/, `<title>${esc(process.env.PREVIEW_TITLE)}</title>`));
          '
          echo "title: $label"
      - name: 'Status: Veröffentlichen'
        if: steps.n.outputs.dir != '.'
        run: bash scripts/pr-status.sh "Veröffentlichen"
      - name: Publish to gh-pages
        run: bash scripts/gh-pages.sh publish "${{ steps.n.outputs.dir }}" dist
      # Cloudflare Workers Static Assets (wrangler.jsonc, Worker `orbis-site`): main -> https://maltee.dev/orbis/,
      # every other branch -> preview URL https://<alias>-orbis-site.<subdomain>.workers.dev/orbis/ (see README "Hosting maltee.dev/orbis").
      # Runs AFTER "Remove assets from dist" (files > 25 MiB must come from R2). Skipped without the secret CLOUDFLARE_API_TOKEN.
      # A failure here must not block GitHub Pages, hence continue-on-error (the error shows up as annotation).
      - name: Cloudflare (maltee.dev/orbis)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID nicht gesetzt – Cloudflare-Deploy übersprungen"; exit 0
          fi
          bash scripts/cf-stage.sh dist dist-cf
          if [ "$BRANCH" = "main" ]; then
            pnpm exec wrangler deploy
            echo "Cloudflare: https://maltee.dev/orbis/" >> "$GITHUB_STEP_SUMMARY"
          else
            # DNS label: lowercase [a-z0-9-], max 63 chars incl. "-orbis-site" (11) -> alias <= 52, no leading/trailing "-"
            alias=$(bash scripts/gh-pages.sh slug "$BRANCH" | tr 'A-Z' 'a-z' | sed 's#[^a-z0-9]#-#g; s#--*#-#g; s#^-##' | cut -c1-52 | sed 's#-$##')
            pnpm exec wrangler versions upload --preview-alias "$alias" --message "${SHA:0:7} $BRANCH"
            echo "Cloudflare-Vorschau: https://$alias-orbis-site.malte9799.workers.dev/orbis/" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: 'Status: Online prüfen'
        if: steps.n.outputs.dir != '.'
        run: bash scripts/pr-status.sh "Online prüfen"
      - name: Wait until the page is live
        if: steps.n.outputs.dir != '.'
        run: |
          # GitHub Pages serves 404 (or the previous deploy) until its build finishes
          for i in $(seq 1 40); do
            got=$(curl -fsS --max-time 10 "${URL}deploy.txt?t=$(date +%s)" 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$got" = "$GITHUB_SHA" ]; then echo "live after attempt $i"; exit 0; fi
            echo "attempt $i: not live yet (${got:-404/unreachable})"
            sleep 10
          done
          echo "::error::$URL did not serve this commit within ~7 min"
          exit 1
      - name: 'Status: fertig'
        if: success() && steps.n.outputs.dir != '.'
        run: bash scripts/pr-status.sh "" done
      - name: 'Status: fehlgeschlagen'
        if: failure() && steps.n.outputs.dir != '.'
        run: bash scripts/pr-status.sh "" failed
      - name: 'Status: abgebrochen'
        if: cancelled() && steps.n.outputs.dir != '.'
        run: bash scripts/pr-status.sh "" cancelled

