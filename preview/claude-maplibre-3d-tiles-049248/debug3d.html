<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7f8" />
    <title>3D Tiles · Orbis Lab</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #eef2f1; color: #182522; font: 14px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; }
      #map { position: absolute; inset: 0; }
      #list { position: absolute; inset: 16px auto 16px 16px; width: 360px; z-index: 2; display: flex; flex-direction: column; overflow: hidden; background: rgba(250,252,251,.97); border: 1px solid rgba(25,49,43,.09); border-radius: 20px; box-shadow: 0 12px 48px rgba(20,38,33,.18); backdrop-filter: blur(18px); }
      .toolbar { padding: 22px 20px 14px; border-bottom: 1px solid #e7eeeb; }
      .heading { display: flex; justify-content: space-between; align-items: start; margin-bottom: 17px; }
      .eyebrow { display: block; color: #6b827a; font-size: 10px; font-weight: 750; letter-spacing: .13em; }
      h1 { margin: 4px 0 1px; font-size: 25px; letter-spacing: -.04em; line-height: 1.2; }
      .heading p { margin: 0; color: #71817b; font-size: 12px; }
      .count { border-radius: 999px; background: #e8f3ef; color: #28614f; padding: 5px 9px; font-size: 11px; font-weight: 700; white-space: nowrap; }
      .toolbar input[type=search] { width: 100%; height: 40px; padding: 0 12px; border: 1px solid #dce6e1; border-radius: 10px; background: #fff; color: #182522; font: inherit; outline: none; }
      .toolbar input[type=search]:focus { border-color: #519b83; box-shadow: 0 0 0 3px #519b831e; }
      .filters { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 9px; scrollbar-width: none; }
      .filters button { border: 1px solid #e0e8e4; border-radius: 999px; background: white; color: #52655e; padding: 5px 9px; font-family: inherit; font-size: 11px; font-weight: 600; line-height: 1.2; white-space: nowrap; cursor: pointer; }
      .filters button.active { border-color: #285e4d; background: #285e4d; color: white; }
      .basemap { width: 100%; height: 37px; margin: 0 0 10px; padding: 0 10px; border: 1px solid #dce6e1; border-radius: 9px; background: #fff; color: #34463f; font: inherit; }
      .terrain, .reviewed { display: flex; align-items: center; gap: 8px; color: #52655e; font-size: 12px; cursor: pointer; }
      input[type=checkbox] { accent-color: #34765f; }
      .selected { margin: 14px 14px 8px; padding: 15px; border: 1px solid #dcebe5; border-radius: 14px; background: linear-gradient(145deg,#f0f8f4,#f8faf9); }
      .selected strong { display: block; margin-top: 6px; font-size: 15px; }
      .selected p { margin: 5px 0 9px; color: #657870; font-size: 12px; }
      .meta { margin-bottom: 10px; color: #39735f; font-size: 11px; font-weight: 650; }
      .groups { overflow: auto; padding: 0 14px 16px; scrollbar-color: #c6d4ce transparent; }
      .source-group { border-bottom: 1px solid #e8eeeb; }
      .source-group summary { padding: 12px 4px 9px; color: #596c64; font-size: 11px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; list-style: none; }
      .source-group summary::after { content: '+'; float: right; color: #799087; font-size: 15px; line-height: 12px; }
      .source-group[open] summary::after { content: '−'; }
      .source-row { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 2px 3px; border-radius: 8px; }
      .source-row:hover { background: #f0f5f2; }
      .source-row[hidden] { display: none; }
      .source-name { flex: 1; min-width: 0; overflow: hidden; border: 0; background: none; color: #24352f; font-family: inherit; font-size: 12px; font-weight: 500; line-height: 1.3; text-align: left; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
      .source-name:hover, .source-name.active { color: #267256; }
      .source-row input { margin: 0 4px; }
      #status { position: absolute; right: 16px; bottom: 54px; z-index: 2; max-width: min(420px, calc(100vw - 410px)); padding: 12px 15px; border: 1px solid #ffffff38; border-radius: 13px; background: rgba(20,34,30,.82); color: #f2f7f4; box-shadow: 0 8px 28px #10221b28; backdrop-filter: blur(14px); font: 11px/1.6 ui-monospace, SFMono-Regular, monospace; white-space: pre-wrap; }
      #note { position: absolute; right: 16px; top: 16px; z-index: 2; max-width: min(440px, calc(100vw - 410px)); padding: 11px 14px; border: 1px solid #f0d6b3; border-radius: 12px; background: #fff8ed; color: #724412; box-shadow: 0 6px 20px #18252218; font-size: 12px; }
      #note[hidden] { display: none; }
      button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid #377e66; outline-offset: 2px; }
      @media (max-width: 650px) { #list { inset: 8px 8px auto; width: auto; max-height: min(54vh, 480px); border-radius: 16px; } .toolbar { padding: 15px 15px 10px; } .heading { margin-bottom: 10px; } .selected { margin: 9px 10px 5px; padding: 10px 12px; } .selected p { margin-bottom: 5px; } .groups { padding: 0 10px 10px; } #status { right: 8px; bottom: 52px; max-width: calc(100vw - 16px); } #note { top: auto; right: 8px; bottom: 110px; max-width: calc(100vw - 16px); } }
    </style>
    <script type="module" crossorigin src="./assets/debug3d-BddEmaB0.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/store-Do8szHXU.js">
    <link rel="stylesheet" crossorigin href="./assets/store-CEya5O3P.css">
  </head>
  <body>
    <div id="map"></div>
    <aside id="list" aria-label="3D-Tiles Quellen"></aside>
    <div id="status">Wähle eine Quelle aus der Liste.</div>
    <div id="note" role="status" hidden></div>
  </body>
</html>
